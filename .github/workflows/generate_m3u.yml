name: Generate IPTV VOD M3U

on:
  workflow_dispatch:        # Ejecución manual
  schedule:
    - cron: "0 6 * * *"     # Diario a las 06:00 UTC

permissions:
  contents: write

jobs:
  build-m3u:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPTV VOD extractor
        env:
          IPTV_URL:      ${{ secrets.IPTV_URL }}
          MAC_ADDRESS:   ${{ secrets.MAC_ADDRESS }}
          SERIAL_NUMBER: ${{ secrets.SERIAL_NUMBER }}
          DEVICE_ID:     ${{ secrets.DEVICE_ID }}
          DEVICE_ID_2:   ${{ secrets.DEVICE_ID_2 }}
          # --- Filtro de categorías ---
          CATEGORY_FILTERS:              "| ASIA | HINDI,| ES |"
          CATEGORY_FILTER_MODE:          "startswith"   # o "contains"
          CATEGORY_FILTER_CASE_SENSITIVE: "false"

          # --- Resolución de links ---
          RESOLVE_LINKS:                 "true"
          RESOLVE_WORKERS:               "20"
          RESOLVE_RATE_LIMIT:            "30"
          RESOLVE_RETRIES:               "3"

          MAX_WORKERS:                   "5"
          OUTPUT_DIR:                    "output"
        run: python iptv_vod_m3u.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-vod-m3u
          path: output/iptv_vod.m3u
          retention-days: 30

      - name: Commit & push generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/iptv_vod.m3u
          git commit -m "Añadir directorio output"
          if git diff --cached --quiet; then
            echo "No hay cambios para commitear."
          else
            git commit -m "chore: update VOD M3U ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
